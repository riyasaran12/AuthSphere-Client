spring.security.oauth2.client.registration.authsphere.client-id=authsphere-client
spring.security.oauth2.client.registration.authsphere.client-secret=secret

spring.security.oauth2.client.registration.authsphere.scope=openid,profile
spring.security.oauth2.client.registration.authsphere.authorization-grant-type=authorization_code

spring.security.oauth2.client.registration.authsphere.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.authsphere.authorization-uri=http://localhost:9000/oauth2/authorize
spring.security.oauth2.client.provider.authsphere.token-uri=http://localhost:9000/oauth2/token
spring.security.oauth2.client.provider.authsphere.jwk-set-uri=http://localhost:9000/oauth2/jwks

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.web.client=DEBUG
server.servlet.session.cookie.name=CLIENT_SESSION


logging.level.org.springframework.security.oauth2.client.web=TRACE
logging.level.org.springframework.security.oauth2.client.web.HttpSessionOAuth2AuthorizationRequestRepository=TRACE
logging.level.org.springframework.session=TRACE